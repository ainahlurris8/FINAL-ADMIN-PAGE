<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description"
        content="PCAP – Pedestrian Contactless Apprehension Program: automated violation monitoring for Barangay Pampang">
    <meta name="theme-color" content="#8B1E1E">
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Cpath d=%27M18 22Q50 8 82 22L80 56Q74 80 50 94Q26 80 20 56Z%27 fill=%27%238B1E1E%27/%3E%3Cpath d=%27M50 28L68 60H32Z%27 fill=%27%23fff%27/%3E%3C/svg%3E">
    <script>try { document.documentElement.dataset.theme = localStorage.getItem("pcap-theme") || "light" } catch (e) { }</script>
    <title>PCAP Admin | Pedestrian Contactless Apprehension Program</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap"
        rel="stylesheet">

    <style>
        /* ---------- Base styles ---------- */
        :root {
            --c: #8B1E1E;
            --c2: #6f1616;
            --bg: #f3f1f1;
            --card: #fff;
            --tx: #1d1d1f;
            --mu: #6b6b70;
            --bd: #e2dede;
            --ok: #1f7a3d;
            --wa: #c27a00;
            --bl: #1e3a6e;
        }

        :root[data-theme="dark"] {
            --bg: #1a1717;
            --card: #252121;
            --tx: #f1ecec;
            --mu: #a69f9f;
            --bd: #3a3333;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font: 14px/1.45 "Segoe UI", system-ui, sans-serif;
            background: var(--bg);
            color: var(--tx);
        }

        button {
            font: inherit;
            cursor: pointer;
        }

        header {
            background: var(--c);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            position: sticky;
            top: 0;
            z-index: 5;
        }

        header b {
            font-size: 15px;
        }

        header span {
            font-size: 11px;
            opacity: .8;
            display: block;
        }

        .hr {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .lo {
            background: #fff;
            color: var(--c);
            border: 0;
            border-radius: 4px;
            padding: 5px 14px;
            font-weight: 600;
        }

        .shell {
            display: flex;
            min-height: calc(100vh - 54px);
        }

        nav {
            width: 210px;
            background: var(--card);
            border-right: 1px solid var(--bd);
            padding: 12px 0;
            flex: none;
        }

        nav a {
            display: block;
            padding: 10px 20px;
            color: var(--tx);
            cursor: pointer;
            border-left: 4px solid transparent;
        }

        nav a:hover {
            background: var(--bg);
        }

        nav a.on {
            background: var(--c);
            color: #fff;
            border-left-color: #000;
        }

        nav small {
            display: block;
            padding: 14px 20px 4px;
            color: var(--mu);
            font-size: 11px;
        }

        main {
            flex: 1;
            padding: 22px 26px;
            min-width: 0;
        }

        h1 {
            font-size: 20px;
            margin: 0 0 2px;
            color: var(--c);
        }

        .sub {
            color: var(--mu);
            margin: 0 0 16px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--bd);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .grid {
            display: grid;
            gap: 14px;
        }

        .g4 {
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
        }

        .g2 {
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        }

        .stat {
            border-left: 4px solid var(--c);
        }

        .stat b {
            font-size: 28px;
            display: block;
        }

        .stat span {
            color: var(--mu);
            font-size: 12px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: var(--c);
            color: #fff;
            text-align: left;
            padding: 9px 10px;
            font-size: 12px;
        }

        td {
            padding: 9px 10px;
            border-bottom: 1px solid var(--bd);
            font-size: 13px;
        }

        tbody tr:hover {
            background: var(--bg);
        }

        .tw {
            overflow-x: auto;
        }

        .pill {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 99px;
            font-size: 11px;
            font-weight: 700;
            color: #fff;
        }

        .Approved,
        .Settled,
        .Success {
            background: var(--ok);
        }

        .Rejected,
        .Failed {
            background: var(--c);
        }

        .Review,
        .Pending {
            background: var(--wa);
        }

        .Unpaid {
            background: #777;
        }

        .Verification {
            background: var(--bl);
        }

        .lk {
            color: var(--c);
            background: none;
            border: 0;
            font-weight: 600;
            padding: 0;
            text-decoration: underline;
        }

        .tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin: 0 0 12px;
        }

        .tab {
            border: 1px solid var(--bd);
            background: var(--card);
            color: var(--tx);
            border-radius: 99px;
            padding: 5px 14px;
        }

        .tab.on {
            background: var(--c);
            color: #fff;
            border-color: var(--c);
        }

        .bar {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        input,
        select,
        textarea {
            font: inherit;
            padding: 8px 10px;
            border: 1px solid var(--bd);
            border-radius: 6px;
            background: var(--card);
            color: var(--tx);
            width: 100%;
        }

        .bar input {
            flex: 1;
            min-width: 200px;
            width: auto;
        }

        .bar select {
            width: auto;
        }

        .btn {
            background: var(--c);
            color: #fff;
            border: 0;
            border-radius: 6px;
            padding: 8px 18px;
            font-weight: 600;
        }

        .btn:hover {
            background: var(--c2);
        }

        .btn.o {
            background: none;
            color: var(--c);
            border: 1px solid var(--c);
        }

        .btn.g {
            background: var(--ok);
        }

        .btn.b {
            background: var(--bl);
        }

        .row {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 14px;
            flex-wrap: wrap;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .kv {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px 18px;
            margin: 8px 0 4px;
        }

        .kv label {
            display: block;
            color: var(--mu);
            font-size: 11px;
        }

        .kv div {
            font-weight: 600;
        }

        h3 {
            font-size: 13px;
            color: var(--c);
            border-bottom: 2px solid var(--c);
            padding-bottom: 4px;
            margin: 18px 0 8px;
        }

        .ev {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            align-items: center;
        }

        .img {
            width: 230px;
            height: 130px;
            background: #2b2b2b;
            border-radius: 6px;
            position: relative;
            overflow: hidden;
        }

        .img i {
            position: absolute;
            border: 2px solid #3ddc84;
            left: 30%;
            top: 35%;
            width: 40%;
            height: 35%;
        }

        .img em {
            position: absolute;
            left: 30%;
            top: 28%;
            font: 10px monospace;
            color: #3ddc84;
            font-style: normal;
        }

        .back {
            color: var(--c);
            cursor: pointer;
            background: none;
            border: 0;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .ov {
            position: fixed;
            inset: 0;
            background: #0008;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
            padding: 16px;
        }

        .md {
            background: var(--card);
            border-radius: 8px;
            width: min(480px, 100%);
            max-height: 90vh;
            overflow: auto;
            border-top: 5px solid var(--c);
            padding: 18px;
            animation: pop .15s;
        }

        @keyframes pop {
            from {
                transform: scale(.96);
                opacity: 0;
            }
        }

        .md h2 {
            margin: 0 0 10px;
            font-size: 16px;
        }

        .md label {
            display: block;
            margin: 10px 0 3px;
            font-size: 12px;
            color: var(--mu);
        }

        .err {
            color: var(--c);
            font-size: 12px;
            margin-top: 4px;
        }

        .banner {
            padding: 10px 14px;
            border-radius: 6px;
            margin-top: 12px;
            font-weight: 600;
        }

        .banner.s {
            background: #dff3e5;
            color: #14502a;
        }

        .banner.f {
            background: #f8dcdc;
            color: var(--c);
        }

        .cams {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 10px;
        }

        .cam {
            background: #222;
            color: #fff;
            padding: 7px;
            border-radius: 6px;
            text-align: center;
            font-size: 12px;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .cam.on {
            border-color: var(--c);
            background: var(--c);
        }

        .feed {
            background: #111;
            height: 320px;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
        }

        .box {
            position: absolute;
            border: 2px solid #3ddc84;
            color: #3ddc84;
            font: 10px monospace;
            transition: all 1.2s linear;
        }

        .road {
            position: absolute;
            left: 0;
            right: 0;
            top: 60%;
            height: 2px;
            background: #555;
        }

        .chart {
            display: flex;
            align-items: flex-end;
            gap: 12px;
            height: 140px;
        }

        .chart div {
            flex: 1;
            background: var(--c);
            border-radius: 4px 4px 0 0;
            position: relative;
            min-height: 4px;
        }

        .chart span {
            position: absolute;
            bottom: -18px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 10px;
            color: var(--mu);
        }

        #toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #222;
            color: #fff;
            padding: 10px 16px;
            border-radius: 6px;
            z-index: 30;
            display: none;
        }

        @media(max-width:760px) {
            nav {
                display: none;
            }

            .cams {
                grid-template-columns: 1fr 1fr;
            }
        }

        /* ---------- Polish / visual refinements ---------- */
        body {
            font-family: Inter, "Segoe UI", system-ui, sans-serif;
            background: linear-gradient(180deg, #f7f3f3, #ece6e6) fixed;
        }

        :root[data-theme="dark"] body {
            background: #151212;
        }

        header {
            background: linear-gradient(100deg, #5e1010, var(--c) 55%, #a32a2a);
            box-shadow: 0 2px 14px #0004;
            padding: 12px 24px;
        }

        header b {
            font-size: 17px;
            letter-spacing: .5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        header b:before {
            content: "★";
            display: grid;
            place-items: center;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #fff;
            color: var(--c);
            font-size: 15px;
        }

        .lo {
            border-radius: 99px;
            transition: .15s;
        }

        .lo:hover {
            background: #ffe3e3;
        }

        nav {
            padding: 16px 12px;
            background: var(--card);
            box-shadow: 2px 0 12px #0001;
        }

        nav a {
            border-radius: 10px;
            border-left: 0;
            margin-bottom: 4px;
            display: flex;
            gap: 12px;
            align-items: center;
            transition: .15s;
        }

        nav a i {
            font-style: normal;
            width: 22px;
            text-align: center;
            opacity: .75;
        }

        nav a:hover {
            background: #8b1e1e14;
            transform: translateX(2px);
        }

        nav a.on {
            background: linear-gradient(100deg, var(--c), #b03434);
            box-shadow: 0 4px 12px #8b1e1e55;
        }

        main {
            padding: 28px 34px;
            max-width: 1400px;
        }

        h1 {
            font-size: 24px;
            letter-spacing: -.3px;
        }

        .card {
            border: 0;
            border-radius: 14px;
            box-shadow: 0 2px 4px #0001, 0 8px 24px #0000000d;
        }

        .stat {
            border-left: 0;
            position: relative;
            overflow: hidden;
            padding: 18px 18px 18px 74px;
        }

        .stat:before {
            content: "";
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--c), #c04545);
            box-shadow: 0 4px 10px #8b1e1e44;
        }

        .stat:after {
            content: attr(data-i);
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 42px;
            text-align: center;
            color: #fff;
            font-size: 18px;
        }

        .stat b {
            font-size: 30px;
            letter-spacing: -1px;
        }

        table {
            border-collapse: separate;
            border-spacing: 0;
        }

        th {
            background: #f3e9e9;
            color: var(--c);
            font-weight: 700;
            border-bottom: 2px solid var(--c);
        }

        th:first-child {
            border-radius: 8px 0 0 0;
        }

        th:last-child {
            border-radius: 0 8px 0 0;
        }

        :root[data-theme="dark"] th {
            background: #2e2323;
        }

        tbody tr {
            transition: .12s;
        }

        tbody tr:hover {
            background: #8b1e1e0d;
        }

        td {
            padding: 11px 10px;
        }

        .pill {
            padding: 3px 11px;
            box-shadow: 0 1px 3px #0003;
        }

        .btn {
            border-radius: 10px;
            box-shadow: 0 3px 8px #8b1e1e33;
            transition: .15s;
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .btn.o {
            box-shadow: none;
        }

        .btn.o:hover {
            background: #8b1e1e12;
        }

        .tab {
            transition: .15s;
        }

        .tab:hover {
            border-color: var(--c);
        }

        .tab.on {
            box-shadow: 0 3px 8px #8b1e1e44;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: 2px solid #8b1e1e55;
            border-color: var(--c);
        }

        .md {
            border-radius: 16px;
            box-shadow: 0 20px 60px #0006;
        }

        .ov {
            backdrop-filter: blur(3px);
        }

        h3 {
            border: 0;
            border-left: 4px solid var(--c);
            padding: 2px 0 2px 10px;
            background: linear-gradient(90deg, #8b1e1e10, transparent);
        }

        .feed {
            background: radial-gradient(circle at 50% 120%, #2a2a2a, #0a0a0a);
            box-shadow: inset 0 0 60px #000;
        }

        .feed:before {
            content: "● LIVE";
            position: absolute;
            top: 10px;
            left: 12px;
            color: #ff5555;
            font: 700 11px monospace;
            z-index: 2;
        }

        .cam {
            border-radius: 10px;
        }

        .chart div {
            background: linear-gradient(180deg, #c04545, var(--c));
        }

        .donut {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            flex: none;
        }

        .donut>div {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background: var(--card);
            display: grid;
            place-items: center;
            text-align: center;
            font-weight: 700;
            font-size: 22px;
            line-height: 1.1;
        }

        .donut small {
            display: block;
            font-size: 10px;
            font-weight: 400;
            color: var(--mu);
        }

        .hb {
            margin: 10px 0;
        }

        .hb div {
            height: 10px;
            background: var(--bd);
            border-radius: 9px;
            overflow: hidden;
        }

        .hb i {
            display: block;
            height: 100%;
            background: linear-gradient(90deg, var(--c), #d36060);
            border-radius: 9px;
        }

        .hb p {
            display: flex;
            justify-content: space-between;
            margin: 0 0 3px;
            font-size: 12px;
        }

        .lg {
            display: flex;
            gap: 6px;
            align-items: center;
            font-size: 12px;
            margin: 5px 0;
        }

        .lg u {
            width: 10px;
            height: 10px;
            border-radius: 3px;
            display: inline-block;
        }

        @media print {

            header,
            nav,
            .noprint {
                display: none;
            }

            main {
                padding: 0;
            }
        }

        header b:before {
            display: none;
        }

        header svg {
            width: 40px;
            height: 40px;
            filter: drop-shadow(0 2px 5px #0006);
        }

        .bell {
            position: relative;
            background: #ffffff26;
            border: 0;
            color: #fff;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 16px;
        }

        .bell:hover {
            background: #ffffff40;
        }

        .bell em {
            position: absolute;
            top: -3px;
            right: -3px;
            background: #fff;
            color: var(--c);
            font: 700 10px sans-serif;
            min-width: 17px;
            height: 17px;
            border-radius: 9px;
            display: none;
            place-items: center;
            font-style: normal;
        }

        #np {
            position: fixed;
            top: 60px;
            right: 20px;
            z-index: 25;
        }

        .npn {
            width: 350px;
            max-width: 92vw;
            background: var(--card);
            color: var(--tx);
            border-radius: 14px;
            box-shadow: 0 12px 40px #0005;
            padding: 14px;
            animation: pop .15s;
        }

        .ni {
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            gap: 10px;
            font-size: 13px;
            margin-top: 4px;
        }

        .ni:hover {
            background: var(--bg);
        }

        .ni.un {
            border-left: 3px solid var(--c);
            background: #8b1e1e12;
            font-weight: 600;
        }

        .ni small {
            color: var(--mu);
            white-space: nowrap;
            font-weight: 400;
        }

        .att {
            border: 1px solid var(--bd);
            background: var(--bg);
            border-radius: 12px;
            padding: 14px;
            text-align: left;
            color: var(--tx);
            transition: .15s;
        }

        .att b {
            display: block;
            font-size: 26px;
            color: var(--c);
        }

        .att:hover {
            border-color: var(--c);
            transform: translateY(-2px);
        }

        /* System name under the PCAP logo */
        header .sysname {
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            opacity: 1;
        }

        /* ---------- Compact layout (less white space) ---------- */
        body {
            font-size: 13px;
        }

        header {
            padding: 8px 16px;
        }

        nav {
            width: 190px;
            padding: 10px 8px;
        }

        nav a {
            padding: 8px 12px;
            margin-bottom: 2px;
        }

        main {
            padding: 14px 18px;
            max-width: none;
        }

        h1 {
            font-size: 20px;
            margin: 0;
        }

        .sub {
            margin: 0 0 10px;
        }

        .card {
            padding: 12px 14px;
            margin-bottom: 10px;
        }

        .grid {
            gap: 10px;
        }

        .stat {
            padding: 12px 12px 12px 66px;
        }

        .stat b {
            font-size: 26px;
        }

        th {
            padding: 8px 10px;
        }

        td {
            padding: 7px 10px;
        }

        tbody tr:nth-child(even) {
            background: #8b1e1e08;
        }

        h3 {
            margin: 12px 0 6px;
        }

        .top {
            margin-bottom: 8px;
        }

        .row {
            margin-top: 10px;
        }

        .bar {
            margin-bottom: 8px;
        }

        .tabs {
            gap: 6px;
            margin: 0 0 6px;
        }

        .tab {
            padding: 3px 12px;
            font-size: 12px;
        }

        .tabrow {
            display: flex;
            gap: 10px;
            align-items: baseline;
        }

        .tabrow>b {
            font-size: 12px;
            color: var(--mu);
            min-width: 104px;
        }

        .feed {
            height: 380px;
        }

        /* detail pages: bordered info grid like the design */
        .kv {
            gap: 1px;
            background: var(--bd);
            border: 1px solid var(--bd);
            border-radius: 8px;
            overflow: hidden;
            margin: 6px 0;
        }

        .kv>div {
            background: var(--card);
            padding: 7px 12px;
        }

        /* ---------- Fonts, header and login ---------- */
        body {
            font-family: Inter, "Segoe UI", system-ui, sans-serif;
        }

        h1,
        h3,
        th,
        .btn,
        .tab,
        nav a,

            return `<h1>E-Contest Management</h1><p class="sub">Review appeals filed against violations</p>
     <div class="tabs">${fs.map((f) => `<button class="tab ${S.f == f ? "on" : ""}" onclick="S.f='${f}';render()">${f}</button>`).join("")}</div>
     <div class="card tw"><table><thead><tr><th>E-Contest ID</th><th>E-Ticket No.</th><th>Plate No.</th><th>Violation</th><th>Contestant</th><th>Submitted</th><th>Status</th><th></th></tr></thead><tbody>${C.filter((c) => S.f == "All" || c.status == S.f).map((c) => `<tr><td>${c.id}</td><td>${c.vid}</td><td>${(V.find((v) => v.id == c.vid) || {}).plate}</td><td>${(V.find((v) => v.id == c.vid) || {}).type}</td><td>${c.by}</td><td>${c.date}</td><td>${pill(c.status)}</td><td><button class="lk" onclick="go('cd','${c.id}')">View</button></td></tr>`).join("") || "<tr><td colspan=8>No contests.</td></tr>"}</tbody></table></div>`;
        }
        function cd() {
            const c = C.find((x) => x.id == S.id), v = V.find((x) => x.id == c.vid), p = c.status == "Pending Review";
            return `<button class="back" onclick="go('cont')">← Back to e-contest management</button><div class="card"><div class="top"><h1>E-Contest details ${pill(c.status)}</h1><button class="btn o" onclick="auditFor('${c.id}')">View audit logs</button></div>
     <h3>A. Contest information</h3>${kv([["E-Contest ID", c.id], ["E-Ticket No.", c.vid], ["Date submitted", c.date], ["Contestant", c.by]])}
     <h3>B. Original violation</h3>${kv([["Violation ID", v.id], ["Plate", v.plate], ["Type", v.type], ["Location", v.loc], ["Payment status", pill(v.pay)]])}<p><button class="lk" onclick="go('vd','${v.id}')">View original violation</button></p>
     <h3>C. Contestant's statement</h3>${kv([["Reason", c.reason], ["Explanation", c.exp]])}
     <h3>D. Evidence & attachments</h3><div class="ev"><div class="img"><i></i></div><div class="img"><em>proof_of_ownership.jpg</em></div></div>
     <h3>E. Admin review</h3>${kv([["Review decision", p ? "Pending review" : c.status], ["Reviewer notes", c.note || "Awaiting assessment"]])}
     ${p ? `<div class="row"><button class="btn o" onclick="toast('Modification request sent to contestant')">Request modification</button><button class="btn o" onclick="cRej('${c.id}')">Reject contest</button><button class="btn g" onclick="cApp('${c.id}')">Approve contest</button></div>` : ""}</div>`;
        }
        function cApp(id) {
            modal(`<h2>✔ Confirm contest approval</h2><p>Approving will mark the appeal as approved and cancel the linked violation.</p><label>Decision notes (optional)</label><textarea id="n" rows="3"></textarea><div class="row"><button class="btn o" onclick="modal()">Back</button><button class="btn g" onclick="cDo('${id}',1)">Confirm approval</button></div>`);
        }
        function cRej(id) {
            modal(`<h2>✖ Reject contest</h2><label>Reason for rejection *</label><select id="r"><option value="">Select reason</option><option>Insufficient supporting evidence</option><option>Contest filed late</option><option>Statement not credible</option><option>Other</option></select><label>Additional notes (optional)</label><textarea id="n" rows="3"></textarea><div class="err" id="e"></div><div class="row"><button class="btn o" onclick="modal()">Back</button><button class="btn" onclick="cDo('${id}',0)">Confirm rejection</button></div>`);
        }
        function cDo(id, ok) {
            const c = C.find((x) => x.id == id);
            let r = "";
            if (!ok) {
                r = $("#r").value;
                if (!r) {
                    $("#e").textContent = "Select a reason for rejection.";
                    return;
                }
            }
            c.status = ok ? "Approved" : "Rejected";
            c.note = ok ? $("#n").value || "Contest approved" : r + ($("#n").value ? ": " + $("#n").value : "");
            if (ok) {
                const v = V.find((x) => x.id == c.vid);
                v.status = "Rejected";
                v.pay = "N/A";
                v.note = "Contest approved: violation cancelled";
            }
            log("E-Contest", ok ? "Contest approved" : "Contest rejected", "Success", id + (ok ? " approved, violation cancelled" : " rejected: " + r));
            modal();
            toast("Contest " + (ok ? "approved" : "rejected"));
            render();
        }
        try {
            const d = JSON.parse(localStorage.getItem("pcap-v2") || "null");
            if (d) {
                V = d.V;
                C = d.C;
                L = d.L;
                N = d.N;
                (d.CAM || []).forEach((c, i) => CAM[i].on = c.on);
            }
        } catch (e) {
        }
        bell();
        render();
        setInterval(simulate, 45e3);

        // ============================== LOGIN / LOGOUT ==============================
        try { if (sessionStorage.getItem("pcap-auth") == "1") document.body.classList.remove("out"); } catch (e) { }
        $("#lgo").innerHTML = $("header svg").outerHTML;
        function doLogin() {
            const u = $("#lu").value.trim().toUpperCase(), p = $("#lp").value;
            if (!u || !p) { $("#le").textContent = "Enter your Admin ID and password."; return; }
            if (u != "AD-2026" || p != "admin123") { $("#le").textContent = "Incorrect Admin ID or password."; return; }
            try { sessionStorage.setItem("pcap-auth", "1"); } catch (e) { }
            $("#le").textContent = ""; $("#lp").value = "";
            document.body.classList.remove("out");
            log("Authentication", "Admin logged in", "Success", "Session started");
            go("dash");
            toast("Welcome, " + user);
        }
        function doLogout() {
            log("Authentication", "Admin logged out", "Success", "Session ended");
            save();
            try { sessionStorage.removeItem("pcap-auth"); } catch (e) { }
            clearInterval(window._lv); modal(); $("#np").innerHTML = "";
            document.body.classList.add("out");
        }
        $("#login").addEventListener("keydown", (e) => { if (e.key == "Enter") doLogin(); });

        // ============================== THEME TOGGLE ==============================
        const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
        const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
        function setTheme(t) {
            document.documentElement.dataset.theme = t;
            try { localStorage.setItem("pcap-theme", t); } catch (e) { }
            document.querySelectorAll(".tt").forEach((b) => {
                b.innerHTML = t == "dark" ? SUN : MOON;
                const l = t == "dark" ? "Switch to light mode" : "Switch to dark mode";
                b.title = l; b.setAttribute("aria-label", l);
            });
        }
        function togTheme() { setTheme(document.documentElement.dataset.theme == "dark" ? "light" : "dark"); }
        setTheme(document.documentElement.dataset.theme == "dark" ? "dark" : "light");
    </script>
</body>

</html>
